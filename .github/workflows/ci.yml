name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.adoc'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.adoc'
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        include:
          # SMW 6+ requires MW >= 1.43; SMW 5.1 is the last release supporting MW 1.39.
          # Experimental until the code is compatible with MW 1.39.
          - mediawiki_version: '1.39'
            smw_version: 5.1.0
            ar_version: REL1_39
            php_version: 8.1
            database_type: mysql
            database_image: "mariadb:10"
            coverage: false
            experimental: true
          - mediawiki_version: '1.43'
            smw_version: dev-master
            ar_version: master
            php_version: 8.1
            database_type: mysql
            database_image: "mariadb:10"
            coverage: false
            experimental: false
          - mediawiki_version: '1.43'
            smw_version: dev-master
            ar_version: master
            php_version: 8.2
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: true
            experimental: false
          - mediawiki_version: '1.44'
            smw_version: dev-master
            ar_version: master
            php_version: 8.3
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: false
            experimental: false
          - mediawiki_version: '1.45'
            smw_version: dev-master
            ar_version: master
            php_version: 8.4
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: false
            experimental: false
          - mediawiki_version: '1.46'
            smw_version: dev-master
            ar_version: master
            php_version: 8.4
            database_type: mysql
            database_image: "mariadb:12.3"
            coverage: false
            experimental: true

    env:
      MW_VERSION: ${{ matrix.mediawiki_version }}
      SMW_VERSION: ${{ matrix.smw_version }}
      AR_VERSION: ${{ matrix.ar_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      DB_TYPE: ${{ matrix.database_type }}
      DB_IMAGE: ${{ matrix.database_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        run: make ci
        if: matrix.coverage == false

      - name: Run tests with coverage
        run: mkdir -p build/coverage && make ci-coverage
        if: matrix.coverage == true

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SemanticMediaWiki/SemanticApprovedRevs
          files: build/coverage/php/coverage.xml
          disable_search: true
        if: matrix.coverage == true
